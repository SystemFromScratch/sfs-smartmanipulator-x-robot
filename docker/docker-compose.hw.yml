# Hardware override: passes a serial device (for example the ST-LINK virtual COM
# port of a doppelstep drive) into the Robot PC container. Linux host only
# (Docker Desktop on Windows does not expose /dev/ttyACM*). Use it together with the base file:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.hw.yml \
#     run --rm robot_pc bash
#
# hardware:=real is refused by the bringup until the bench stage is verified;
# until then use this override for device diagnostics (picocom, DynamixelSDK).

services:
  robot_pc:
    devices:
      - ${SMX_SERIAL_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0
    group_add:
      - dialout
