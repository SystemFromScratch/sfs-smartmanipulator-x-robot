  <path class="gnd" d="M875 115 L875 190"/>
  <circle class="dot" cx="845" cy="75" r="3.5"/>
  <circle class="dot" cx="875" cy="115" r="3.5"/>
  <rect class="fab" x="820" y="190" width="85" height="80" rx="6"/>
  <text class="h" x="832" y="214">ID 5</text>
  <text class="t" x="832" y="235">J3-2, J3-5</text>
  <path class="data" d="M940 75 L940 190"/>
  <path class="gnd" d="M970 115 L970 190"/>
  <circle class="dot" cx="940" cy="75" r="3.5"/>
  <circle class="dot" cx="970" cy="115" r="3.5"/>
  <rect class="fab" x="915" y="190" width="85" height="80" rx="6"/>
  <text class="h" x="927" y="214">ID 6</text>
  <text class="t" x="927" y="235">J3-2, J3-5</text>
  <path class="nc" d="M1035 75 L1035 190"/>
  <path class="nc" d="M1065 115 L1065 190"/>
  <rect class="fut" x="1010" y="190" width="85" height="80" rx="6"/>
  <text class="h" x="1022" y="214">ID 7</text>
  <text class="t" x="1022" y="235">gripper</text>
  <text class="s" x="20" y="300" text-anchor="start">Order on the cable does not matter (IDs are set in each drive). Keep the cable short (about 1.5 m along the arm) and away from the motor phases; twist DATA with GND.</text>
