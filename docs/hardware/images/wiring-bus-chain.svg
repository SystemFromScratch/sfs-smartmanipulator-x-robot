<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" role="img" aria-label="DYNAMIXEL bus wiring: the CM4-Duino bus interface feeds DATA and GND in a daisy chain to the J3 pads of drives 1 to 6 and to the gripper node" xmlns:c2pa="http://c2pa.org/manifest">
  <title>DYNAMIXEL bus wiring: the CM4-Duino bus interface feeds DATA and GND in a daisy chain to the J3 pads of drives 1 to 6 and to the gripper node</title>
  <style>
    .pc { fill: #f1f3f4; stroke: #5f6368; stroke-width: 1.5; }
    .kit { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
    .ic { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.5; }
    .fab { fill: #e6f4ea; stroke: #188038; stroke-width: 1.5; }
    .drv { fill: #fef7e0; stroke: #b06000; stroke-width: 1.5; }
    .pwr { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .fut { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .pad { fill: #ffffff; stroke: #3c4043; stroke-width: 1.2; }
    .h { font-weight: 700; font-size: 15px; fill: #202124; }
    .t { fill: #202124; }
    .s { fill: #5f6368; font-size: 12px; }
    .n { fill: #1a73e8; font-size: 12px; font-weight: 600; }
    .w { stroke: #3c4043; stroke-width: 2; fill: none; }
    .data { stroke: #188038; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #202124; stroke-width: 2.5; fill: none; }
    .vm { stroke: #c5221f; stroke-width: 3; fill: none; }
    .v6 { stroke: #e37400; stroke-width: 2.5; fill: none; }
    .v5 { stroke: #b06000; stroke-width: 2.5; fill: none; }
    .sig { stroke: #1a73e8; stroke-width: 2; fill: none; }
    .ph { stroke: #9334e6; stroke-width: 2.5; fill: none; }
    .nc { stroke: #9aa0a6; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .dot { fill: #202124; }
  </style>
  <rect class="kit" x="20" y="30" width="170" height="110" rx="8"/>
  <text class="h" x="32" y="54">CM4-Duino</text>
  <text class="t" x="32" y="75">D14 TX, D15 RX</text>
  <text class="s" x="32" y="93">3V3, GND</text>
  <rect class="pc" x="230" y="30" width="170" height="110" rx="8"/>
  <text class="h" x="242" y="54">Bus interface</text>
  <text class="t" x="242" y="75">U1–U3, R1</text>
  <text class="s" x="242" y="93">see the circuit</text>
  <path class="sig" d="M190 70 L230 70"/>
  <path class="sig" d="M190 90 L230 90"/>
  <path class="gnd" d="M190 120 L230 120"/>
  <path class="data" d="M400 75 L1080 75"/>
  <path class="gnd" d="M400 115 L1080 115"/>
  <text class="n" x="410" y="66" text-anchor="start">DATA</text>
  <text class="s" x="410" y="133" text-anchor="start">GND</text>
