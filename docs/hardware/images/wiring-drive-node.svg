<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" width="1060" height="590" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" role="img" aria-label="Connections of one doppelstep drive (B-G431B-ESC1): motor supply on J5/J6, stepper coils on J7, DYNAMIXEL bus on J3" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Connections of one doppelstep drive (B-G431B-ESC1): motor supply on J5/J6, stepper coils on J7, DYNAMIXEL bus on J3</title>
  <style>
    .pc { fill: #f1f3f4; stroke: #5f6368; stroke-width: 1.5; }
    .kit { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
    .ic { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.5; }
    .fab { fill: #e6f4ea; stroke: #188038; stroke-width: 1.5; }
    .drv { fill: #fef7e0; stroke: #b06000; stroke-width: 1.5; }
    .pwr { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .fut { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .pad { fill: #ffffff; stroke: #3c4043; stroke-width: 1.2; }
    .h { font-weight: 700; font-size: 15px; fill: #202124; }
    .t { fill: #202124; }
    .s { fill: #5f6368; font-size: 12px; }
    .n { fill: #1a73e8; font-size: 12px; font-weight: 600; }
    .w { stroke: #3c4043; stroke-width: 2; fill: none; }
    .data { stroke: #188038; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #202124; stroke-width: 2.5; fill: none; }
    .vm { stroke: #c5221f; stroke-width: 3; fill: none; }
    .v6 { stroke: #e37400; stroke-width: 2.5; fill: none; }
    .v5 { stroke: #b06000; stroke-width: 2.5; fill: none; }
    .sig { stroke: #1a73e8; stroke-width: 2; fill: none; }
    .ph { stroke: #9334e6; stroke-width: 2.5; fill: none; }
    .nc { stroke: #9aa0a6; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .dot { fill: #202124; }
  </style>
  <rect class="fab" x="330" y="60" width="380" height="500" rx="8"/>
  <text class="h" x="342" y="84">B-G431B-ESC1 · doppelstep</text>
  <text class="t" x="342" y="105">STM32G431CB, Zephyr</text>
  <text class="s" x="342" y="123">power stage: 3 half-bridges, current sensing</text>
  <rect class="pc" x="400" y="150" width="240" height="70" rx="8"/>
  <text class="h" x="412" y="174">ST-LINK (on board)</text>
  <text class="t" x="412" y="195">micro-USB: VCP = USART2, SWD, RTT</text>
  <path class="sig" d="M520 150 L520 30"/>
  <text class="s" x="528" y="40" text-anchor="start">USB to the bench PC (Stage 2 only)</text>
  <rect class="pad" x="340" y="270" width="110" height="20" rx="3"/>
  <text class="t" x="348" y="284" font-size="12">J5  V+  (+)</text>
  <rect class="pad" x="340" y="320" width="110" height="20" rx="3"/>
  <text class="t" x="348" y="334" font-size="12">J6  GND (−)</text>
  <rect class="pwr" x="20" y="245" width="220" height="120" rx="8"/>
  <text class="h" x="32" y="269">Motor supply V_M</text>
  <text class="t" x="32" y="290">from the distribution rail</text>
  <text class="s" x="32" y="308">voltage: open (≤ 24 V, see text)</text>
  <text class="s" x="32" y="324">short, thick wires</text>
  <path class="vm" d="M240 280 L340 280"/>
  <path class="gnd" d="M240 330 L340 330"/>
  <rect class="pad" x="600" y="260" width="100" height="20" rx="3"/>
  <text class="t" x="608" y="274" font-size="12">J7  OUT1</text>
  <rect class="pad" x="600" y="300" width="100" height="20" rx="3"/>
  <text class="t" x="608" y="314" font-size="12">J7  OUT2</text>
  <rect class="pad" x="600" y="340" width="100" height="20" rx="3"/>
  <text class="t" x="608" y="354" font-size="12">J7  OUT3</text>
  <rect class="drv" x="820" y="230" width="220" height="170" rx="8"/>
  <text class="h" x="832" y="254">Stepper motor</text>
  <text class="t" x="832" y="275">bipolar, 4 wires</text>
  <text class="t" x="832" y="300" text-anchor="start">Coil A: A+ / A−</text>
  <text class="t" x="832" y="322" text-anchor="start">Coil B: B+ / B−</text>
  <text class="s" x="832" y="352" text-anchor="start">A− and B− share OUT3</text>
  <text class="s" x="832" y="368" text-anchor="start">(assumed, see text)</text>
  <path class="ph" d="M700 270 L800 270 L820 270"/>
  <text class="s" x="760" y="264" text-anchor="start">A+</text>
  <path class="ph" d="M700 310 L780 310 L780 330 L820 330"/>
  <text class="s" x="760" y="304" text-anchor="start">B+</text>
  <path class="ph" d="M700 350 L760 350 L760 385 L820 385"/>
  <text class="s" x="728" y="344" text-anchor="start">A−, B−</text>
  <text class="n" x="345" y="418" text-anchor="start">J3 (pads, fit a 5-pin header)</text>
  <rect class="pad" x="340" y="440" width="170" height="20" rx="3"/>
  <text class="t" x="348" y="454" font-size="12">1  +5V (BEC output)</text>
  <rect class="pad" x="340" y="462" width="170" height="20" rx="3"/>
  <text class="t" x="348" y="476" font-size="12">2  USART2_TX · PB3</text>
  <rect class="pad" x="340" y="484" width="170" height="20" rx="3"/>
  <text class="t" x="348" y="498" font-size="12">3  USART2_RX · PB4</text>
  <rect class="pad" x="340" y="506" width="170" height="20" rx="3"/>
  <text class="t" x="348" y="520" font-size="12">4  PWM · PA15</text>
  <rect class="pad" x="340" y="528" width="170" height="20" rx="3"/>
  <text class="t" x="348" y="542" font-size="12">5  GND</text>
  <rect class="fab" x="820" y="440" width="220" height="90" rx="8"/>
  <text class="h" x="832" y="464">DYNAMIXEL bus</text>
  <text class="t" x="832" y="485">DATA, GND</text>
  <text class="s" x="832" y="503">daisy chain to the next drive</text>
  <path class="data" d="M510 472 L760 472 L760 470 L820 470"/>
  <path class="gnd" d="M510 538 L780 538 L780 505 L820 505"/>
  <path class="nc" d="M510 450 L540 450"/>
  <text class="s" x="546" y="454" text-anchor="start">not connected</text>
  <path class="nc" d="M510 494 L540 494"/>
  <text class="s" x="546" y="498" text-anchor="start">not connected</text>
  <path class="nc" d="M510 516 L540 516"/>
  <text class="s" x="546" y="520" text-anchor="start">not connected</text>
  <path class="vm" d="M20 430 L48 430"/>
  <text class="s" x="56" y="434" text-anchor="start">motor supply</text>
  <path class="gnd" d="M20 448 L48 448"/>
  <text class="s" x="56" y="452" text-anchor="start">ground</text>
  <path class="ph" d="M20 466 L48 466"/>
  <text class="s" x="56" y="470" text-anchor="start">motor phase</text>
  <path class="data" d="M20 484 L48 484"/>
  <text class="s" x="56" y="488" text-anchor="start">bus DATA</text>
  <path class="nc" d="M20 502 L48 502"/>
  <text class="s" x="56" y="506" text-anchor="start">not connected</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
