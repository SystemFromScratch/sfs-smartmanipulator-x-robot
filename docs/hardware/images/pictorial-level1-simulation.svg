<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" role="img" aria-label="Level 1: everything on one computer, no hardware. Docker runs the Operator PC with MoveIt and RViz and the Robot PC with simulated joints">
  <title>Level 1: everything on one computer, no hardware. Docker runs the Operator PC with MoveIt and RViz and the Robot PC with simulated joints</title>
  <style>
    .h { font-weight: 700; font-size: 16px; fill: #202124; }
    .t { fill: #202124; font-size: 13px; }
    .s { fill: #5f6368; font-size: 12px; }
    .w { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .k { fill: #e8eaed; font-size: 10px; }
    .tag { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
    .step { fill: #1a73e8; }
    .stept { fill: #ffffff; font-weight: 700; font-size: 14px; }
  </style>
  <rect x="60" y="50" width="380" height="210" rx="8" fill="#3c4043" stroke="#202124" stroke-width="1.5" />
  <rect x="68" y="58" width="364" height="194" rx="4" fill="#e8f0fe" stroke="none" stroke-width="1.5" />
  <text class="h" x="250.0" y="82" text-anchor="middle">Your computer</text>
  <text class="s" x="250.0" y="104" text-anchor="middle">Docker</text>
  <path d="M40 272 L460 272 L440 260 L60 260 Z" fill="#9aa0a6" stroke="#5f6368"/>
  <rect x="90" y="120" width="150" height="100" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.5" />
  <text class="t" x="165" y="146" text-anchor="middle">Operator PC</text>
  <text class="s" x="165" y="170" text-anchor="middle">MoveIt 2</text>
  <text class="s" x="165" y="188" text-anchor="middle">RViz2</text>
  <rect x="270" y="120" width="150" height="100" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5" />
  <text class="t" x="345" y="146" text-anchor="middle">Robot PC</text>
  <text class="s" x="345" y="170" text-anchor="middle">ros2_control</text>
  <text class="s" x="345" y="188" text-anchor="middle">simulated joints</text>
  <path d="M240 170 L270 170" stroke="#1a73e8" stroke-width="3" marker-end="none"/>
  <text class="s" x="250" y="238" text-anchor="middle">DDS</text>
  <text class="t" x="250" y="310" text-anchor="middle">No cables, no boards, no power supply.</text>
  <text class="h" x="560" y="70" text-anchor="start">What you can do here</text>
  <text class="t" x="560" y="102" text-anchor="start">• plan and execute arm motions in MoveIt 2 and watch them in RViz2</text>
  <text class="t" x="560" y="126" text-anchor="start">• write your own planners, controllers or kinematics nodes in ROS 2</text>
  <text class="t" x="560" y="150" text-anchor="start">• send trajectories to arm_controller and read /joint_states</text>
  <text class="t" x="560" y="174" text-anchor="start">• later (Stage 1): replace the simulated joints by doppelstep</text>
  <text class="t" x="572" y="198" text-anchor="start">drives that run their real firmware on your PC</text>
  <text class="s" x="560" y="240" text-anchor="start">Start: Getting started, two docker compose commands.</text>
</svg>
