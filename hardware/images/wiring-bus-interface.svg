  <rect class="kit" x="20" y="20" width="220" height="300" rx="8"/>
  <text class="h" x="32" y="44">CM4-Duino</text>
  <text class="s" x="32" y="65">Arduino headers, 3.3 V logic</text>
  <rect class="pad" x="40" y="100" width="180" height="20" rx="3"/>
  <text class="t" x="48" y="114" font-size="12">D14 · GPIO14 TXD0</text>
  <rect class="pad" x="40" y="150" width="180" height="20" rx="3"/>
  <text class="t" x="48" y="164" font-size="12">D15 · GPIO15 RXD0</text>
  <rect class="pad" x="40" y="220" width="180" height="20" rx="3"/>
  <text class="t" x="48" y="234" font-size="12">3V3 (power header)</text>
  <rect class="pad" x="40" y="270" width="180" height="20" rx="3"/>
  <text class="t" x="48" y="284" font-size="12">GND</text>
  <rect class="pc" x="290" y="20" width="520" height="420" rx="8"/>
  <text class="h" x="302" y="44">Bus interface (breadboard, later a shield)</text>
  <text class="s" x="300" y="432" text-anchor="start">Each gate: 100 nF from VCC (3V3) to GND, next to the IC</text>
  <rect class="ic" x="440" y="90" width="120" height="34" rx="4"/>
  <text class="n" x="500" y="72" text-anchor="middle">U1</text>
  <text class="s" x="500" y="85" text-anchor="middle">74LVC1G07 · open-drain buffer</text>
  <text class="s" x="446" y="111" text-anchor="start">A</text>
  <text class="s" x="554" y="111.0" text-anchor="end">Y</text>
  <rect class="ic" x="330" y="250" width="120" height="34" rx="4"/>
  <text class="n" x="390" y="232" text-anchor="middle">U2</text>
  <text class="s" x="390" y="245" text-anchor="middle">74LVC1G04</text>
  <text class="s" x="336" y="271" text-anchor="start">A</text>
  <text class="s" x="444" y="271.0" text-anchor="end">Y</text>
  <rect class="ic" x="600" y="250" width="120" height="58" rx="4"/>
  <text class="n" x="660" y="232" text-anchor="middle">U3</text>
  <text class="s" x="660" y="245" text-anchor="middle">74LVC1G32 · OR</text>
  <text class="s" x="606" y="271" text-anchor="start">A</text>
  <text class="s" x="606" y="295" text-anchor="start">B</text>
  <text class="s" x="714" y="283.0" text-anchor="end">Y</text>
  <path class="sig" d="M220 110 L300 110 L300 107 L440 107"/>
  <circle class="dot" cx="300" cy="110" r="3.5"/>
