  <path class="data" d="M560 107.0 L700 107.0"/>
  <circle class="dot" cx="700" cy="107.0" r="3.5"/>
  <path class="v5" d="M700 48 L700 55"/>
  <text class="s" x="708" y="46" text-anchor="start">3V3</text>
  <rect class="pad" x="694" y="55" width="12" height="34"/>
  <text class="s" x="710" y="76" text-anchor="start">R1 470 Ω</text>
  <path class="data" d="M700 89 L700 107.0"/>
  <path class="data" d="M700 107.0 L700 170"/>
  <rect class="pad" x="666" y="164" width="34" height="12"/>
  <text class="s" x="683" y="160" text-anchor="middle"></text>
  <text class="s" x="683" y="160" text-anchor="middle">R2 100 Ω</text>
  <path class="data" d="M700 170 L700 170"/>
  <path class="data" d="M666 170 L575 170 L575 267 L600 267"/>
  <circle class="dot" cx="620" cy="170" r="3.5"/>
  <path class="w" d="M620 170 L620 182"/>
  <path class="w" d="M610 182 L630 182"/>
  <path class="w" d="M610 187 L630 187"/>
  <path class="w" d="M620 187 L620 199"/>
  <text class="s" x="634" y="189" text-anchor="start">C1 100 pF</text>
  <path class="w" d="M620 199 L620 207"/>
  <path class="w" d="M610 207 L630 207"/>
  <path class="w" d="M614 211 L626 211"/>
  <path class="w" d="M618 215 L622 215"/>
  <path class="sig" d="M720 279.0 L760 279.0 L760 400 L260 400 L260 160 L220 160"/>
