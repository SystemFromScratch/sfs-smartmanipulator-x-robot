  <path class="gnd" d="M220 280 L280 280 L280 470 L900 470"/>
  <rect class="fab" x="840" y="60" width="140" height="140" rx="8"/>
  <text class="h" x="852" y="84">BUS</text>
  <text class="s" x="852" y="105">to all drives</text>
  <rect class="pad" x="850" y="110" width="120" height="20" rx="3"/>
  <text class="t" x="858" y="124" font-size="12">1 DATA</text>
  <rect class="pad" x="850" y="160" width="120" height="20" rx="3"/>
  <text class="t" x="858" y="174" font-size="12">2 GND</text>
  <path class="data" d="M700 107.0 L790 107.0 L790 120 L850 120"/>
  <path class="gnd" d="M900 470 L900 230 L830 230 L830 170 L850 170"/>
  <path class="sig" d="M30 360 L58 360"/>
  <text class="s" x="66" y="364" text-anchor="start">logic signal (3.3 V)</text>
  <path class="data" d="M30 378 L58 378"/>
  <text class="s" x="66" y="382" text-anchor="start">bus DATA</text>
  <path class="gnd" d="M30 396 L58 396"/>
  <text class="s" x="66" y="400" text-anchor="start">ground</text>
  <path class="v5" d="M30 414 L58 414"/>
  <text class="s" x="66" y="418" text-anchor="start">3V3 supply</text>
  <text class="s" x="20" y="500" text-anchor="start">Sending: U1 pulls DATA low for every 0 bit; R1 pulls it back to 3.3 V. Receiving: U3 passes DATA to RXD0 only while TXD0 is high,</text>
  <text class="s" x="20" y="518" text-anchor="start">so the CM4 does not receive its own transmission (no echo). R2/C1 delay DATA by ~10 ns against /TX, so no glitch reaches RXD0 at a falling edge.</text>
  <text class="s" x="20" y="536" text-anchor="start">Proposed circuit: build and measure it in Stage 3 before relying on it.</text>
