<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" role="img" aria-label="Bus interface between the CM4-Duino UART0 and the single-wire DYNAMIXEL bus: open-drain driver, echo-blocking receive gate, pull-up" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bus interface between the CM4-Duino UART0 and the single-wire DYNAMIXEL bus: open-drain driver, echo-blocking receive gate, pull-up</title>
