  <rect class="pad" x="710" y="230" width="160" height="20" rx="3"/>
  <text class="t" x="718" y="244" font-size="12">red · +6 V</text>
  <rect class="pad" x="710" y="270" width="160" height="20" rx="3"/>
  <text class="t" x="718" y="284" font-size="12">brown · GND</text>
