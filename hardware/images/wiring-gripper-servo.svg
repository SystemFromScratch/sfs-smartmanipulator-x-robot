<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" role="img" aria-label="Gripper servo wiring: the gripper node on the DYNAMIXEL bus drives the MG996R signal; the servo is powered from its own 6 V converter" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Gripper servo wiring: the gripper node on the DYNAMIXEL bus drives the MG996R signal; the servo is powered from its own 6 V converter</title>
  <style>
    .pc { fill: #f1f3f4; stroke: #5f6368; stroke-width: 1.5; }
    .kit { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
    .ic { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.5; }
    .fab { fill: #e6f4ea; stroke: #188038; stroke-width: 1.5; }
    .drv { fill: #fef7e0; stroke: #b06000; stroke-width: 1.5; }
    .pwr { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .fut { fill: #ffffff; stroke: #9aa0a6; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .pad { fill: #ffffff; stroke: #3c4043; stroke-width: 1.2; }
    .h { font-weight: 700; font-size: 15px; fill: #202124; }
    .t { fill: #202124; }
    .s { fill: #5f6368; font-size: 12px; }
    .n { fill: #1a73e8; font-size: 12px; font-weight: 600; }
    .w { stroke: #3c4043; stroke-width: 2; fill: none; }
    .data { stroke: #188038; stroke-width: 2.5; fill: none; }
    .gnd { stroke: #202124; stroke-width: 2.5; fill: none; }
    .vm { stroke: #c5221f; stroke-width: 3; fill: none; }
    .v6 { stroke: #e37400; stroke-width: 2.5; fill: none; }
    .v5 { stroke: #b06000; stroke-width: 2.5; fill: none; }
    .sig { stroke: #1a73e8; stroke-width: 2; fill: none; }
    .ph { stroke: #9334e6; stroke-width: 2.5; fill: none; }
    .nc { stroke: #9aa0a6; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .dot { fill: #202124; }
  </style>
  <rect class="fut" x="20" y="40" width="260" height="230" rx="8"/>
  <text class="h" x="32" y="64">Gripper node (ID 7)</text>
  <text class="t" x="32" y="85">virtual DYNAMIXEL</text>
  <text class="s" x="32" y="103">separate project, MCU open</text>
  <rect class="pad" x="40" y="120" width="150" height="20" rx="3"/>
  <text class="t" x="48" y="134" font-size="12">bus DATA</text>
  <rect class="pad" x="40" y="160" width="150" height="20" rx="3"/>
  <text class="t" x="48" y="174" font-size="12">GND</text>
  <rect class="pad" x="40" y="210" width="200" height="20" rx="3"/>
  <text class="t" x="48" y="224" font-size="12">PWM out (3.3 V, 50 Hz)</text>
  <rect class="fab" x="20" y="320" width="170" height="70" rx="8"/>
  <text class="h" x="32" y="344">DYNAMIXEL bus</text>
  <text class="t" x="32" y="365">DATA, GND</text>
