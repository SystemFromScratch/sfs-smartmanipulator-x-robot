<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13" role="img" aria-label="Power distribution: motor supply with emergency stop and fuse to six drives and the servo converter, separate 5 V supply for the CM4-Duino, one ground star point" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Power distribution: motor supply with emergency stop and fuse to six drives and the servo converter, separate 5 V supply for the CM4-Duino, one ground star point</title>
  <style>
