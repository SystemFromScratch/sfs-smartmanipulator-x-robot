# MkDocs configuration of the SmartManipulator-X documentation
# (SystemFromScratch® documentation style).
#
#   Preview:     python -m mkdocs serve
#   Website:     python -m mkdocs build                (output: site/)
#   PDF manual:  python tools/docs/build_manual.py     (settings: extra.manual)
#
# Dependencies: requirements-docs.txt. See docs/development.md.

site_name: SmartManipulator-X
site_description: >-
  A BCN3D Moveo arm driven by the unchanged ROBOTIS OpenMANIPULATOR-X ROS 2 stack:
  doppelstep stepper drives answer as DYNAMIXEL servos on one bus, and the Robot PC
  runs ROS 2 Jazzy in Docker on a Raspberry Pi CM4 (CM4-Duino).
site_author: Anton Vynohradov
site_url: https://systemfromscratch.github.io/sfs-smartmanipulator-x-robot/   # GitHub Pages path = repository name
repo_url: https://github.com/SystemFromScratch/sfs-smartmanipulator-x-robot
repo_name: SystemFromScratch/sfs-smartmanipulator-x-robot
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  diagrams/
  **/diagrams/
  hardware/cm4-duino/vendor/
  hardware/datasheets/

nav:
  - Home: index.md
  - Guide:
      - Overview: overview.md
      - Getting started: getting-started.md
      - "Tutorial: the whole robot in simulation": tutorial-simulation.md
      - Connection guide for beginners: beginners.md
      - Development: development.md
      - Project status: status.md
      - "Integration plan: doppelstep + CM4-Duino": plan/doppelstep-cm4.md
  - Robot PC:
      - Robot PC: robot-pc/index.md
      - "Tutorial: checking SIL step by step": robot-pc/sil-tutorial.md
      - Robot PC on the CM4-Duino: robot-pc/cm4-duino.md
      - BCN3D Moveo mechanics: mechanical/index.md
  - System:
      - System architecture: architecture/index.md
      - DYNAMIXEL Bus: dynamixel/bus.md
      - DYNAMIXEL Compatibility: dynamixel/compatibility-spec.md
      - Operator PC: operator-pc/index.md
  - Hardware:
      - CM4-Duino board: hardware/cm4-duino/index.md
      - doppelstep drives: hardware/doppelstep.md
      - Wiring: hardware/wiring.md
      - Gripper Servo (MG996R): hardware/gripper-servo.md
  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  generator: false
  # Header download button (overrides/partials/header.html); CI builds the PDF
  # into docs/downloads/ before deploying.
  manual_pdf: downloads/SmartManipulator-X_User_Manual.pdf
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0005-6965-0911
      name: Anton Vynohradov on ORCID
    - icon: material/web
      link: https://systemfromscratch.com
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html. Story: hero -> the problem (3 problem->solution
  # cards) -> what you get (6 linked cards) -> stats -> quick start (docs/index.md)
  # -> SystemFromScratch® portfolio banner.
  landing:
    eyebrow: Open-source robotics project
    title: ROS 2 robot arm
    accent: on DYNAMIXEL-speaking stepper drives
    lead: >-
      SmartManipulator-X is built so that the unchanged ROBOTIS OpenMANIPULATOR-X ROS 2
      stack can drive a BCN3D Moveo arm: every stepper joint gets a doppelstep drive that
      answers DYNAMIXEL Protocol 2.0 as an XM430-W350, and the Robot PC runs ros2_control
      in Docker, on a Raspberry Pi CM4 on the robot.
    hero_image: assets/images/hero-3d.svg
    hero_alt: >-
      Isometric scene: a Robot PC running ROS 2 sends DYNAMIXEL packets to a row of
      doppelstep stepper drives, which move a BCN3D Moveo arm
    buttons:
      - {text: Get started, link: getting-started/, style: primary}
      - {text: View on GitHub, link: "https://github.com/SystemFromScratch/sfs-smartmanipulator-x-robot", style: outline}
    features:
      - {icon: layers, line1: ROS 2 Jazzy, line2: in Docker}
      - {icon: chip, line1: Raspberry Pi CM4, line2: CM4-Duino}
      - {icon: bus, line1: DYNAMIXEL, line2: Protocol 2.0}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: Servo software, stepper hardware
      intro: >-
        The ROBOTIS OpenMANIPULATOR-X stack is a complete ROS 2 arm application, but it
        expects DYNAMIXEL smart servos that answer Protocol 2.0 from their Control
        Tables. The BCN3D Moveo is a printed arm with NEMA stepper motors and no bus at
        all. Porting the ROS side to every new arm is expensive, so SmartManipulator-X
        moves the adaptation into a controller that looks like DYNAMIXEL servos to the
        host.
      cards:
        - icon: bus
          title: Keep the ROS 2 stack unchanged
          text: >-
            Each stepper joint has a doppelstep drive that answers as a DYNAMIXEL
            XM430-W350 (IDs 1–6) on one Protocol 2.0 bus, so the stock ROBOTIS
            hardware interface is meant to drive the arm without project-specific code.
            The gripper follows as a virtual DYNAMIXEL on ID 7.
          tags: [Protocol 2.0, XM430-W350, doppelstep]
        - icon: monitor
          title: Develop without the arm
          text: >-
            The Robot PC runs ros2_control with mock hardware on a Docker network that
            stands in for the link to the Operator PC; MoveIt commands from the
            Operator PC container already reach it over DDS.
          tags: [Docker, ros2_control, DDS]
        - icon: layers
          title: A model from the real mechanics
          text: >-
            The robot description is generated from the BCN3D Moveo CAD: joint axes from
            the axles, link lengths of 231.64, 221.12 and 223.00 mm, visual and collision
            meshes, the gripper linkage.
          tags: [STEP to URDF, Xacro, Meshes]
    offer:
      eyebrow: What you get
      title: One system from MoveIt to the stepper drive
      intro: >-
        Three parts and one contract: the Operator PC for planning, the Robot PC with
        ROS 2 control on a Raspberry Pi CM4, and the doppelstep drives on a DYNAMIXEL
        bus, documented together with what works today and what is planned.
      cards:
        - {icon: monitor, title: Robot PC, text: "ROS 2 Jazzy image with ros2_control and the ROBOTIS DYNAMIXEL interface, for any Docker host and the CM4.", tags: [Docker, ros2_control], link: robot-pc/}
        - {icon: chip, title: CM4-Duino board, text: "The Robot PC board on the robot: pinout, settings and links to the vendor files of a discontinued board.", tags: [CM4, Pinout], link: hardware/cm4-duino/}
        - {icon: plug, title: DYNAMIXEL bus, text: "Topology, bus parameters, ID map and the half-duplex interface between the CM4 and the drives.", tags: [Protocol 2.0, Half duplex], link: dynamixel/bus/}
        - {icon: lock, title: The shared contract, text: "System architecture, component boundaries and the DYNAMIXEL compatibility specification, with what is verified and what is not.", tags: [Architecture, Verification], link: architecture/}
        - {icon: document, title: Complete documentation, text: "Guides, the Robot PC, the bus, the hardware and the mechanics on one site, also as a PDF user manual.", tags: [Guides, PDF], link: overview/}
        - {icon: check, title: Status and plan, text: "One page with the state of every part, and the staged plan from simulation to the full arm.", tags: [Status, Roadmap], link: status/}
    stats:
      - {value: "6 + 1", label: stepper drives + gripper}
      - {value: "XM430", label: emulated by each drive}
      - {value: "CM4", label: Robot PC on the robot}
      - {value: "Jazzy", label: ROS 2 on the Robot PC}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        SmartManipulator-X is developed by Anton Vynohradov under SystemFromScratch®:
        "Secure embedded systems and compliance-ready engineering — from concept to
        certification-ready product." It is also teaching material for several levels,
        from algorithms in simulation to the electronics of the real arm.
      buttons:
        - {text: SystemFromScratch®, link: "https://systemfromscratch.com", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. ROBOTIS, DYNAMIXEL and OpenMANIPULATOR
      are trademarks of ROBOTIS Co., Ltd.; Raspberry Pi is a trademark of Raspberry Pi
      Ltd; Waveshare, STM32, ROS and BCN3D are trademarks of their owners;
      SmartManipulator-X is not affiliated with or endorsed by them.

  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py.
  manual:
    title: SmartManipulator-X
    subtitle: ROS 2 Robot Arm on DYNAMIXEL-Compatible Stepper Drives
    output: build/manual/SmartManipulator-X_User_Manual_v{version}.pdf
    eyebrow: Open-source robotics project
    cover_image: assets/images/hero-3d.svg
    appendices: [LICENSE.md]
    unnumbered: [about.md]
    web_only: [index.md]
    keywords: robot arm, ROS 2, ros2_control, DYNAMIXEL, doppelstep, Raspberry Pi CM4, CM4-Duino, Zephyr, BCN3D Moveo
    vendor_trademarks: >-
      ROBOTIS, DYNAMIXEL and OpenMANIPULATOR are trademarks of ROBOTIS Co., Ltd.
      Raspberry Pi is a trademark of Raspberry Pi Ltd. Waveshare is a trademark of
      Waveshare Electronics. STM32 is a trademark of STMicroelectronics. ROS is a trademark of Open Source
      Robotics Foundation, Inc. SmartManipulator-X is not affiliated with or endorsed by
      these companies.

extra_css:
  - assets/stylesheets/extra.css

hooks:
  - tools/docs/hooks.py      # captioned figures from plain Markdown images

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
