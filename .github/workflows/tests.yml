name: Tests

on:
  push:
    branches: [main]
    paths:
      - tools/sim/**
      - tools/diagnostics/smx_drive_setup.py
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - tools/sim/**
      - tools/diagnostics/smx_drive_setup.py
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-bus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Virtual DYNAMIXEL bus and drive setup tool (tools/sim, tools/diagnostics)
        run: python -m unittest discover -s tools/sim/tests -v
